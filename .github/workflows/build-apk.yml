name: Build Android APK (NeuralAI)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK with Native NDK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK and CMake via sdkmanager
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/ \;
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: NeuralAI-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 14
