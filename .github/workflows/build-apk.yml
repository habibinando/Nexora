name: Nexora Android - Build and Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 APK and run tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"
          yes | sdkmanager --licenses

      - name: Verify wrapper and toolchain
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
          test -d "$ANDROID_HOME/ndk/29.0.13113456"
          test -d "$ANDROID_HOME/cmake/3.31.6"

      - name: Run unit tests and build APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Publish rolling nightly APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nexora Nightly
          body: |
            APK ARM64 terbaru dari branch main.
            Model GGUF tidak disertakan. Impor model sendiri setelah memasang aplikasi.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
