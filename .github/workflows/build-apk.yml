name: Build Android APK (Nexora)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK with Native NDK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK PATH, Accept Licenses & Install NDK / CMake
        run: |
          ANDROID_SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$ANDROID_SDK_PATH" ] || [ ! -d "$ANDROID_SDK_PATH" ]; then
            ANDROID_SDK_PATH="/usr/local/lib/android/sdk"
          fi
          SDKMANAGER="$ANDROID_SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_PATH/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Restore Debug Keystore & Google Services Configuration
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

          if [ ! -f app/google-services.json ]; then
            echo "Generating fallback app/google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "139731441168",
              "project_id": "nexora-ondevice",
              "storage_bucket": "nexora-ondevice.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:139731441168:android:820468a2bf6f52e391b1a0",
                  "android_client_info": {
                    "package_name": "com.aistudio.neuralai.vkzqmr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_client_key_for_offline_local_build"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true"

      - name: Prepare APK Output
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/ \;
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nexora-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 14
