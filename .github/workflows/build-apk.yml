name: Nexora Android - Build and Verify

on:
  # Build once for a PR that changes app/build inputs. Do not run a second
  # full build merely because the already-tested PR is merged to main.
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  # Publish a nightly APK only when explicitly requested from main.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 APK and run tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK, NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Verify wrapper and toolchain
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/ndk/29.0.13113456"
          test -d "$ANDROID_HOME/cmake/3.31.6"

      - name: Run unit tests and build APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          mkdir -p release
          cp "$APK" release/Nexora-ARM64.apk
          file release/Nexora-ARM64.apk
          sha256sum release/Nexora-ARM64.apk
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(nexora-inference|llama|mtmd|ggml)'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libnexora-inference.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libllama.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmtmd.so'


      - name: Publish rolling nightly APK
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nexora Nightly
          body: |
            APK ARM64 terbaru dari branch main.
            Model GGUF tidak disertakan. Impor model sendiri setelah memasang aplikasi.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release/Nexora-ARM64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
